; fps60x2 - 60 fps mod for Final Fantasy X-2 HD Remaster (work in progress). Read once when the game starts.
; Every setting has a built-in default; this file lists only the ones you may want to change.
; Never install next to another mod that uses dbghelp.dll.
[x2]
; 1 = mod on, 0 = mod off
enabled=1
; 1 = 60 fps, 0 = original 30 fps
pacing=1

[rows]
; smooth camera and character motion between game ticks (F7 toggles in game); 0 = off
X2-SMOOTH=1
; field main menu at 60 fps (other menus stay at the original 30 fps); 0 = off. Num 0 toggles in game
X2-MENU-002=1
; parts of the 60 fps main menu, each also toggled in game:
; Num 1 = panel and command-list slides, Num 2 = panel shadows, Num 3 = screen point, Num 4 = backdrop
X2-MENU-002-TWEEN=1
X2-MENU-002-DRAWREPLAY=1
X2-MENU-002-POINT=1
X2-MENU-002-BACKDROP=1
